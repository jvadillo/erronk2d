[www]
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 15s
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
; Mitigación adicional de CVE-2026-109619 (PHP2Shell); la aplicación no usa el progreso de subida.
php_admin_flag[session.upload_progress.enabled] = off

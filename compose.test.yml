name: erronk2d-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erronk2d_test
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: erronk2d_test
    tmpfs:
      - /var/lib/postgresql/data
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    networks: [test]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U erronk2d_test -d erronk2d_test"]
      interval: 2s
      timeout: 2s
      retries: 20
  tests:
    image: erronk2d-php:local
    command: [php, vendor/bin/phpunit, --colors=never]
    volumes: [".:/app"]
    environment:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: erronk2d_test
      DB_USERNAME: erronk2d_test
      DB_PASSWORD: isolated-test-only
    mem_limit: 768m
    cpus: 1
    pids_limit: 100
    networks: [test]
    depends_on:
      postgres:
        condition: service_healthy
  app:
    profiles: [runtime]
    image: erronk2d-app:local
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
      APP_URL: https://erronk2d.jonvadillo.com
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: erronk2d_test
      DB_USERNAME: erronk2d_test
      DB_PASSWORD: isolated-test-only
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      TRUSTED_PROXIES: REMOTE_ADDR
      LOG_CHANNEL: stderr
      MAIL_MAILER: array
    mem_limit: 384m
    cpus: 0.6
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [test]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    profiles: [runtime]
    image: erronk2d-web:local
    read_only: true
    tmpfs: ["/tmp:uid=1000,gid=1000,mode=1770,size=32m"]
    mem_limit: 64m
    cpus: 0.2
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [test]
    depends_on: [app]
  browser-app:
    profiles: [browser]
    image: erronk2d-php:local
    user: "1000:1000"
    command: [php, artisan, serve, "--host=0.0.0.0", "--port=8083", --no-reload]
    volumes: [".:/app"]
    environment: &browser-environment
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
      APP_URL: http://browser-app:8083
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: erronk2d_test
      DB_USERNAME: erronk2d_test
      DB_PASSWORD: isolated-test-only
      SESSION_SECURE_COOKIE: "false"
      MAIL_MAILER: array
      ERRONK2D_DEMO_PASSWORD: BrowserTestingOnly123
    mem_limit: 384m
    cpus: 0.6
    networks: [test]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8083/login') === false ? 1 : 0);"]
      interval: 3s
      timeout: 3s
      retries: 20
  browser:
    profiles: [browser]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    user: "1000:1000"
    working_dir: /app
    command: [npx, playwright, test]
    volumes: [".:/app"]
    environment:
      TEST_BROWSER_URL: http://browser-app:8083
      TEST_BROWSER_PASSWORD: BrowserTestingOnly123
    mem_limit: 1g
    cpus: 1
    pids_limit: 200
    shm_size: 128m
    networks: [test]
    depends_on:
      browser-app:
        condition: service_healthy
networks:
  test:
    internal: true
